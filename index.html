<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📸🖼️</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <p class="site-title">📸🖼️</p>
  <nav class="tabs">
    <button class="tab" data-tab="all">All</button>
    <button class="tab" data-tab="favorite">❤️MINSEO❤️</button>
  </nav>
</header>

<main>

  <!-- ===================== 전체 탭 (메인) ===================== -->
  <section class="view" id="view-all">
    <div class="grid-heading">
      <h2>All</h2>
      <span class="count" id="allCount"></span>
    </div>
    <div class="post-grid" id="postGrid"></div>
    <div id="sentinel"></div>
    <div class="loading-hint" id="loadingHint">loading…</div>
  </section>

  <!-- ===================== 최애 탭 ===================== -->
  <section class="view" id="view-favorite">
    <div class="fav-head">
      <h2 id="favName"></h2>
      <span class="team" id="favTeam"></span>
    </div>
    <p class="fav-note" id="favNote"></p>
    <div class="fav-grid" id="favGrid"></div>
  </section>

</main>

<footer>(c) 사공, All rights reserved</footer>

<!-- 게시글(선수) 상세 사진 모아보기 -->
<div class="modal-overlay" id="modal">
  <div class="modal-inner">
    <div class="modal-top">
      <div>
        <div class="who" id="modalName"></div>
        <div class="sub" id="modalSub"></div>
      </div>
      <button class="modal-close" id="modalClose">닫기 ✕</button>
    </div>
    <div class="post-modal-grid" id="modalGrid"></div>
  </div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
